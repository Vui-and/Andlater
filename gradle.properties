org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Path to prebuilt native emulator payloads produced by CI
# (QEMU / Box86 / Box64 binaries + custom OS image), copied into
# app/src/main/jniLibs and app/src/main/assets before assembling the APK.
# See .github/workflows/build.yml
customOsEmulator.nativePayloadDir=native-payload
